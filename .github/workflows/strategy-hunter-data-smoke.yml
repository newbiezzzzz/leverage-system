name: strategy-hunter-data-smoke

on:
  push:
    paths:
      - "research/data/**"
      - "research/qa/**"
      - ".github/workflows/strategy-hunter-data-smoke.yml"
      - ".github/workflows/strategy-hunter-data-full.trigger"
      - ".github/workflows/strategy-hunter-data-crosscheck.trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install data tools
        run: pip install -r research/data/requirements.txt

      - name: Build SC Shariah snapshots
        run: |
          cd research/data
          python build_shariah_universe.py

      - name: Download bounded OHLCV smoke sample
        env:
          MAX_SYMBOLS: "30"
          LATEST_ONLY: "1"
        run: |
          cd research/data
          python download_ohlcv.py

      - name: QA smoke dataset
        run: python research/qa/strategy_hunter_data_qa.py

      - name: Basic data inventory
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          p = Path("research/data/data/shariah/shariah_snapshots.csv")
          df = pd.read_csv(p)
          files = list(Path("research/data/data/ohlcv").glob("*.csv"))
          print("Shariah snapshot rows:", len(df))
          print("Unique symbols:", df.yahoo_symbol.nunique())
          print("OHLCV files:", len(files))
          if not files:
              raise SystemExit("No OHLCV files produced")
          PY

      - name: Upload smoke dataset and QA
        uses: actions/upload-artifact@v4
        with:
          name: strategy-hunter-data-smoke
          path: |
            research/data/data/
            research/qa/strategy_hunter_data_qa.json
          retention-days: 7

  full:
    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, 'trigger full Strategy Hunter data job')
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install data tools
        run: pip install -r research/data/requirements.txt

      - name: Build full SC Shariah snapshots
        run: |
          cd research/data
          python build_shariah_universe.py

      - name: Download full historical OHLCV
        env:
          LATEST_ONLY: "0"
          MAX_SYMBOLS: "0"
        run: |
          cd research/data
          python download_ohlcv.py

      - name: QA full dataset
        run: python research/qa/strategy_hunter_data_qa.py

      - name: Install baseline quant tools
        run: pip install -r research/strategy/requirements.txt

      - name: Run fixed-rule baseline strategies with costs
        run: |
          python research/strategy/baseline_research.py
          cp research/results/baseline_results.csv research/results/baseline_with_costs.csv

      - name: Run fixed-rule baseline diagnostic without costs
        env:
          SH_DISABLE_COSTS: "1"
        run: |
          python research/strategy/baseline_research.py
          cp research/results/baseline_results.csv research/results/baseline_no_costs.csv
          cp research/results/baseline_with_costs.csv research/results/baseline_results.csv

      - name: Publish simple baseline result
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          src = Path("research/results/baseline_results.csv")
          if not src.exists():
              raise SystemExit("baseline_results.csv was not produced")

          df = pd.read_csv(src)
          lines = [
              "# Strategy Hunter — Latest Baseline Result",
              "",
              f"Capital: RM1,000 | Period: {df['start'].min()} to {df['end'].max()}",
              "",
              "| Strategy | Final RM1,000 | Return | Max DD | Trades |",
              "|---|---:|---:|---:|---:|",
          ]
          for _, r in df.iterrows():
              lines.append(
                  f"| {r['strategy']} | RM{r['final_equity']:.2f} | {r['total_return']*100:.2f}% | "
                  f"{r['max_drawdown']*100:.2f}% | {int(r['trade_count'])} |"
              )
          lines += [
              "",
              "Research only. No live orders.",
              "This file is machine-published after a successful baseline run.",
          ]
          out = Path("research/results/latest_baseline_result.md")
          out.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Publish cost diagnostic
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          costs = pd.read_csv("research/results/baseline_with_costs.csv")
          free = pd.read_csv("research/results/baseline_no_costs.csv")
          m = costs.merge(free, on="strategy", suffixes=("_costs", "_no_costs"))
          lines = [
              "# Strategy Hunter — Cost Diagnostic",
              "",
              "| Strategy | Final with costs | Final without costs | Difference |",
              "|---|---:|---:|---:|",
          ]
          for _, r in m.iterrows():
              lines.append(
                  f"| {r['strategy']} | RM{r['final_equity_costs']:.2f} | "
                  f"RM{r['final_equity_no_costs']:.2f} | "
                  f"RM{r['final_equity_no_costs']-r['final_equity_costs']:.2f} |"
              )
          Path("research/results/cost_diagnostic.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Commit simple baseline result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/baseline_results.csv research/results/baseline_spec.csv research/results/latest_baseline_result.md research/results/baseline_with_costs.csv research/results/baseline_no_costs.csv research/results/cost_diagnostic.md
          if git diff --cached --quiet; then
            echo "No baseline result changes to commit."
          else
            git commit -m "chore: publish Strategy Hunter baseline result"
            git push
          fi

      - name: Full dataset inventory
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          p = Path("research/data/data/shariah/shariah_snapshots.csv")
          df = pd.read_csv(p)
          files = list(Path("research/data/data/ohlcv").glob("*.csv"))
          failures = pd.read_csv("research/data/data/download_failures.csv")
          exclusions = pd.read_csv("research/data/data/qa_exclusions.csv")
          print("Shariah snapshot rows:", len(df))
          print("Unique Shariah symbols:", df.yahoo_symbol.nunique())
          print("OHLCV files:", len(files))
          print("Download failures:", len(failures))
          print("Cleaned-row exclusions:", len(exclusions))
          if not files:
              raise SystemExit("No OHLCV files produced")
          PY

      - name: Upload full dataset and QA
        uses: actions/upload-artifact@v4
        with:
          name: strategy-hunter-data-full
          path: |
            research/data/data/
            research/qa/strategy_hunter_data_qa.json
            research/results/
          retention-days: 30
          compression-level: 6

  crosscheck:
    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, 'run Strategy Hunter independent cross-check')
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install data tools
        run: pip install -r research/data/requirements.txt

      - name: Independent source cross-check
        run: python research/qa/independent_crosscheck.py

      - name: Upload cross-check report
        uses: actions/upload-artifact@v4
        with:
          name: strategy-hunter-independent-crosscheck
          path: research/qa/independent_crosscheck.*
          retention-days: 30
