name: strategy-hunter-data-smoke-legacy

on:
  workflow_dispatch:

jobs:
  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Legacy smoke validation
        run: |
          python -m py_compile research/strategy/*.py
          echo "Legacy smoke workflow only. Autonomous continuation is controlled by leverage-supervisor.yml."
