name: Leverage Income Acquisition

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
  push:
    branches:
      - feature/income-acquisition-moltjobs-final2

permissions:
  contents: write

jobs:
  discover-funded-work:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run worker self-test
        run: python -m workers.income_acquisition_worker
        env:
          MOLTJOBS_API_KEY: ${{ secrets.MOLTJOBS_API_KEY }}

      - name: Commit discovery state
        run: |
          git config user.name 'leverage-income-bot'
          git config user.email 'leverage-income-bot@users.noreply.github.com'
          git add control_plane/income_acquisition_state.json
          git diff --cached --quiet && exit 0
          git commit -m 'ops: refresh income acquisition state [skip ci]'
          git push
