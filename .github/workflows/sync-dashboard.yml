name: Sync Leverage Dashboard

on:
  workflow_run:
    workflows: ["Leverage Research Worker"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Build dashboard state
        env:
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'manual' }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          p = Path('dashboard/data.json')
          data = json.loads(p.read_text())
          data['generated_at'] = datetime.now(timezone.utc).isoformat()
          data['sync'] = {
              'source': 'github-actions',
              'workflow': 'Leverage Research Worker',
              'run_id': '${WORKFLOW_RUN_ID}',
              'conclusion': '${WORKFLOW_CONCLUSION}',
              'fresh': True
          }
          p.write_text(json.dumps(data, indent=2) + '\\n')
          PY

      - name: Commit dashboard state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data.json
          git diff --cached --quiet || git commit -m "chore: sync dashboard state"
          git push
