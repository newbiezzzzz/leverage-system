name: Leverage Affiliate Research Daily

on:
  schedule:
    - cron: '20 15 * * *'
  push:
    branches: [main]
    paths:
      - 'control_plane/affiliate_research.py'
      - 'control_plane/affiliate_research_config.json'
      - '.github/workflows/affiliate-research-daily.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Collect automotive demand signals
        run: python -m control_plane.affiliate_research
      - name: Commit research queue
        run: |
          git config user.name 'leverage-bot'
          git config user.email 'leverage-bot@users.noreply.github.com'
          git add control_plane/affiliate_research_queue.json
          git diff --cached --quiet && exit 0
          git commit -m 'ops: refresh affiliate research queue'
          git push
