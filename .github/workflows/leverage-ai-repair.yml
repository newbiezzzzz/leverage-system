name: Leverage AI Repair Workers

on:
  workflow_dispatch:
    inputs:
      target_run_id:
        description: "GitHub Actions run ID that exposed the failure"
        required: false
        default: ""
      cycle:
        description: "Leverage research cycle under repair"
        required: false
        default: "current"
      stage:
        description: "Failed Leverage stage"
        required: false
        default: "strategy_lab"

permissions:
  contents: write
  actions: read
  pull-requests: write
  issues: write

concurrency:
  group: leverage-ai-repair
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    outputs:
      codex_ready: ${{ steps.check.outputs.codex_ready }}
      claude_ready: ${{ steps.check.outputs.claude_ready }}
    steps:
      - id: check
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${OPENAI_API_KEY:-}" ] || [ -n "${CODEX_API_KEY:-}" ]; then
            echo "codex_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "codex_ready=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "claude_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "claude_ready=false" >> "$GITHUB_OUTPUT"
          fi

  codex_repair:
    needs: readiness
    if: needs.readiness.outputs.codex_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Run Codex repair worker
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.CODEX_API_KEY || secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          output-file: codex-final.txt
          prompt: |
            You are Leverage's senior engineering repair worker.
            Repair the current Strategy Hunter failure. This is NOT a request
            to redesign the trading strategy or loosen any research gate.

            Context:
            - Repository: ${{ github.repository }}
            - Target Actions run: ${{ inputs.target_run_id }}
            - Research cycle: ${{ inputs.cycle }}
            - Failed stage: ${{ inputs.stage }}

            Investigate first. Inspect the current repository, persistent
            research state, repair queue, workflow files, recent commits, and
            the exact failing run/logs available through GitHub CLI.
            Find the root cause, reproduce it narrowly, and make the smallest
            safe code/workflow repair.

            Hard requirements:
            - Do not place live trades or orders.
            - Do not weaken Shariah, cost, drawdown, trade-frequency,
              lookahead, survivorship, or qualification gates.
            - Do not fabricate successful test evidence.
            - Preserve the intended meaning that a degraded core cycle is
              recovered before a new cycle number is created.
            - The repair must enable real Strategy Lab V4/RR backtests to run.
            - Run targeted verification plus Python compilation/preflight.
            - Modify source/workflow files only; do not commit or push.
            - Leave the workspace with the proposed repair so a second agent
              can independently review it.

            At the end, summarize root cause, files changed, and verification
            performed.
      - name: Export Codex patch
        run: |
          git diff --binary > codex.patch
          test -s codex.patch
      - name: Upload Codex proposal
        uses: actions/upload-artifact@v4
        with:
          name: codex-repair-proposal
          path: |
            codex.patch
            codex-final.txt
          retention-days: 3

  claude_review:
    needs: [readiness, codex_repair]
    if: always() && needs.readiness.outputs.claude_ready == 'true' && (needs.codex_repair.result == 'success' || needs.codex_repair.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download Codex proposal
        if: needs.codex_repair.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: codex-repair-proposal
          path: /tmp/codex
      - name: Apply Codex proposal
        run: |
          if [ -s /tmp/codex/codex.patch ]; then
            git apply --binary /tmp/codex/codex.patch
          else
            echo "No Codex patch available; Claude will perform an independent repair."
          fi
      - name: Run Claude repair/review worker
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 40
          prompt: |
            You are Leverage's independent senior engineer and adversarial
            reviewer. A Codex worker may have proposed a repair in the current
            workspace.

            Context:
            - Repository: ${{ github.repository }}
            - Target Actions run: ${{ inputs.target_run_id }}
            - Research cycle: ${{ inputs.cycle }}
            - Failed stage: ${{ inputs.stage }}

            Independently inspect the root cause. Review any Codex changes
            rather than trusting them. Correct, complete, or replace them when
            necessary. The objective is to restore autonomous Strategy Hunter
            testing, specifically the Strategy Lab V4/RR path.

            Requirements:
            - No live trading or orders.
            - Never relax risk, Shariah, data integrity, cost, lookahead,
              survivorship, or candidate qualification protections.
            - Verify the actual failure mechanism before changing code.
            - Run targeted reproduction, Python compilation, preflight, and any
              relevant narrow tests.
            - Do not create fake result files or claim a test passed without
              executing it.
            - Preserve the degraded-cycle recovery semantics.
            - Make only the smallest safe changes.
            - Do not commit or push; leave the repaired workspace for the
              deterministic verification job.

            Finish with a concise summary of the root cause, reviewed changes,
            and verification evidence.
      - name: Export final repaired patch
        run: |
          git diff --binary > repaired.patch
          if [ ! -s repaired.patch ]; then
            echo "Claude produced no source changes."
          fi
          git diff --stat
      - name: Upload final repair
        uses: actions/upload-artifact@v4
        with:
          name: claude-repaired-proposal
          path: repaired.patch
          if-no-files-found: ignore
          retention-days: 3

  verify_and_pr:
    needs: [readiness, codex_repair, claude_review]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download final repair patch
        if: needs.claude_review.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: claude-repaired-proposal
          path: /tmp/claude
      - name: Download Codex patch fallback
        if: needs.claude_review.result != 'success' && needs.codex_repair.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: codex-repair-proposal
          path: /tmp/codex
      - name: Apply best available repair
        run: |
          if [ -s /tmp/claude/repaired.patch ]; then
            git apply --binary /tmp/claude/repaired.patch
          elif [ -s /tmp/codex/codex.patch ]; then
            git apply --binary /tmp/codex/codex.patch
          else
            echo "No AI repair patch is available."
            exit 2
          fi
      - name: Compile repaired Strategy Hunter
        run: |
          python -m py_compile             research/strategy/strategy_lab_v4.py             research/strategy/realistic_engine_v1.py             research/strategy/pipeline_orchestrator.py
      - name: Install strategy dependencies
        run: pip install -r research/strategy/requirements.txt
      - name: Run repaired preflight
        run: python research/strategy/preflight.py
      - name: Create verified self-heal PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Verification passed but no source changes remain."
            exit 3
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="leverage-self-heal/dual-agent-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add research/strategy .github/workflows control_plane
          git commit -m "fix: dual-agent repair for Strategy Hunter"
          git push origin "$branch"
          gh pr create             --repo "$GITHUB_REPOSITORY"             --base main             --head "$branch"             --title "[Leverage Self-Heal] Dual-agent Strategy Hunter repair"             --body "Automated repair produced by Codex and independently reviewed by Claude.

          Target run: ${{ inputs.target_run_id }}
          Cycle: ${{ inputs.cycle }}
          Stage: ${{ inputs.stage }}

          Verification: Python compilation, dependency installation, and Strategy Hunter preflight passed.
          Deterministic Self-Heal Repair Gate must still pass before automatic merge."

  no_agent_available:
    needs: readiness
    if: needs.readiness.outputs.codex_ready != 'true' && needs.readiness.outputs.claude_ready != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Record missing AI worker credentials
        run: |
          echo "Neither Codex nor Claude credentials are configured."
          echo "The AI repair workers are installed but cannot execute until an AI provider credential is configured in GitHub Actions."
