name: Leverage AI Repair Workers

on:
  workflow_dispatch:
    inputs:
      target_run_id:
        description: "GitHub Actions run ID that exposed the failure"
        required: false
        default: ""
      cycle:
        description: "Leverage research cycle under repair"
        required: false
        default: "current"
      stage:
        description: "Failed Leverage stage"
        required: false
        default: "strategy_lab"

permissions:
  contents: write
  actions: read
  pull-requests: write
  issues: write

concurrency:
  group: leverage-ai-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      TARGET_RUN_ID: ${{ inputs.target_run_id }}
      TARGET_CYCLE: ${{ inputs.cycle }}
      TARGET_STAGE: ${{ inputs.stage }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Select authentication
        run: |
          set -euo pipefail
          if [ -n "${COPILOT_GITHUB_TOKEN:-}" ]; then
            echo "Using Leverage COPILOT_GITHUB_TOKEN."
          else
            echo "COPILOT_GITHUB_TOKEN is not configured; Copilot CLI will use GH_TOKEN/GITHUB_TOKEN."
          fi

      - name: Write Codex repair brief
        run: |
          cat > /tmp/codex-brief.txt <<'EOF'
You are Leverage's senior Codex engineering worker.

Repository: ${GITHUB_REPOSITORY}
Target Actions run: ${TARGET_RUN_ID}
Research cycle: ${TARGET_CYCLE}
Failed stage: ${TARGET_STAGE}

Investigate the actual Strategy Hunter failure before editing. Inspect the
persistent research state, repair queue, workflow files, recent commits, and
the target GitHub Actions run/logs using gh when useful.

Primary objective: restore autonomous Strategy Hunter research and make real
Strategy Lab V4/RR backtests execute.

Rules:
- Do not place live trades or orders.
- Do not weaken Shariah, drawdown, cost, trade-frequency, data-integrity,
  lookahead, survivorship, or candidate-qualification protections.
- Do not fabricate result files or success evidence.
- Preserve degraded-cycle recovery semantics.
- Reproduce the failure narrowly where possible.
- Make the smallest safe repair.
- Run targeted tests, Python compilation, and Strategy Hunter preflight.
- Do not commit or push.
- Leave the working tree containing the proposed repair for the Claude
  reviewer.

At the end, summarize root cause, files changed, and checks performed.
EOF

      - name: Run Codex model
        continue-on-error: true
        env:
          COPILOT_MODEL: gpt-5.3-codex
        run: |
          copilot             -p "$(cat /tmp/codex-brief.txt)"             --model gpt-5.3-codex             --no-ask-user             --allow-tool='write,shell'             --secret-env-vars='COPILOT_GITHUB_TOKEN,GH_TOKEN'             --output-format=text             2>&1 | tee /tmp/codex-output.txt

      - name: Write Claude review brief
        run: |
          cat > /tmp/claude-brief.txt <<'EOF'
You are Leverage's independent Claude engineering reviewer.

Repository: ${GITHUB_REPOSITORY}
Target Actions run: ${TARGET_RUN_ID}
Research cycle: ${TARGET_CYCLE}
Failed stage: ${TARGET_STAGE}

A Codex worker has already investigated and may have changed the working tree.
Independently inspect the failure and the current code. Do not trust the Codex
diagnosis without verification. Correct, complete, or replace it as required.

Primary objective: restore real Strategy Lab V4/RR backtesting and autonomous
research continuation.

Rules:
- No live trades or orders.
- Never weaken Shariah, risk, cost, trade-frequency, data-integrity,
  lookahead, survivorship, or candidate gates.
- Never fabricate evidence.
- Preserve degraded-cycle recovery semantics.
- Run targeted reproduction, Python compilation, Strategy Hunter preflight,
  and relevant narrow tests.
- Make the smallest safe changes.
- Do not commit or push.

Review /tmp/codex-output.txt when useful. Finish with root cause, reviewed
changes, and verification evidence.
EOF

      - name: Run Claude model
        continue-on-error: true
        env:
          COPILOT_MODEL: claude-sonnet-4.6
        run: |
          copilot             -p "$(cat /tmp/claude-brief.txt)"             --model claude-sonnet-4.6             --no-ask-user             --allow-tool='write,shell'             --secret-env-vars='COPILOT_GITHUB_TOKEN,GH_TOKEN'             --output-format=text             2>&1 | tee /tmp/claude-output.txt

      - name: Verify repaired workspace
        run: |
          set -euo pipefail
          python -m py_compile             research/strategy/strategy_lab_v4.py             research/strategy/realistic_engine_v1.py             research/strategy/pipeline_orchestrator.py             research/strategy/preflight.py
          pip install -r research/strategy/requirements.txt
          python research/strategy/preflight.py

      - name: Create verified repair PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git status --short
          if git diff --quiet; then
            echo "No AI repair changes were produced."
            exit 10
          fi

          branch="leverage-self-heal/dual-agent-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/strategy .github/workflows control_plane
          git commit -m "fix: dual-agent repair for Strategy Hunter"
          git push origin "$branch"

          gh pr create             --repo "${GITHUB_REPOSITORY}"             --base main             --head "$branch"             --title "[Leverage Self-Heal] Codex + Claude Strategy Hunter repair"             --body "Automated dual-agent repair.

Target run: ${TARGET_RUN_ID}
Cycle: ${TARGET_CYCLE}
Stage: ${TARGET_STAGE}

Codex investigated first. Claude independently reviewed the resulting
workspace. Deterministic Python compilation and Strategy Hunter preflight
passed before this PR was created.

The existing repair gate must still pass before merge."

      - name: Publish repair evidence
        if: always()
        run: |
          echo "=== Codex ==="
          test -f /tmp/codex-output.txt && tail -100 /tmp/codex-output.txt || true
          echo "=== Claude ==="
          test -f /tmp/claude-output.txt && tail -100 /tmp/claude-output.txt || true
