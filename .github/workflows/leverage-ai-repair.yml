name: Leverage AI Repair Workers

on:
  workflow_dispatch:
    inputs:
      target_run_id:
        description: "GitHub Actions run ID that exposed the failure"
        required: false
        default: ""
      cycle:
        description: "Leverage research cycle under repair"
        required: false
        default: "current"
      stage:
        description: "Failed Leverage stage"
        required: false
        default: "strategy_lab"

permissions:
  contents: write
  actions: read
  pull-requests: write
  issues: write

concurrency:
  group: leverage-ai-repair
  cancel-in-progress: false

jobs:
  dual_agent_repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Prefer the existing Leverage Copilot credential; fall back to the
      # built-in workflow token where repository policy allows Copilot CLI.
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      TARGET_RUN_ID: ${{ inputs.target_run_id }}
      TARGET_CYCLE: ${{ inputs.cycle }}
      TARGET_STAGE: ${{ inputs.stage }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Verify Copilot authentication
        run: |
          set -euo pipefail
          copilot --help >/dev/null
          echo "Copilot CLI installed."
          if [ -n "${COPILOT_GITHUB_TOKEN:-}" ]; then
            echo "Copilot credential is available."
          else
            echo "No Copilot credential is available."
            exit 1
          fi

      - name: Codex repair worker
        id: codex
        continue-on-error: true
        env:
          COPILOT_MODEL: gpt-5.3-codex
        run: |
          set -o pipefail
          copilot             -p "You are Leverage's senior Codex repair worker.

Repository: ${GITHUB_REPOSITORY}
Target Actions run: ${TARGET_RUN_ID}
Research cycle: ${TARGET_CYCLE}
Failed stage: ${TARGET_STAGE}

Investigate the actual Strategy Hunter failure before changing anything.
Inspect the latest research state, repair queue, workflow files, recent
commits, and relevant source. Use GitHub CLI/API when needed to inspect the
target workflow run and logs.

Your job is to restore autonomous Strategy Hunter testing, especially the
Strategy Lab V4/RR execution path.

Rules:
- Do not place live trades or orders.
- Do not weaken Shariah rules, cost assumptions, drawdown limits,
  trade-frequency gates, data QA, lookahead protection, survivorship checks,
  or candidate qualification.
- Do not fabricate evidence or result files.
- Preserve the rule that a degraded core cycle must be recovered before a new
  cycle number is created.
- Reproduce the failure narrowly when possible.
- Make the smallest safe repair.
- Run targeted checks, Python compilation, and Strategy Hunter preflight.
- Do not commit or push changes. Leave the repaired workspace for Claude to
  independently review.

Report root cause, changes, and verification in your final response."             --model gpt-5.3-codex             --no-ask-user             --allow-tool='write,shell'             --secret-env-vars='COPILOT_GITHUB_TOKEN,GITHUB_TOKEN'             --output-format=text             2>&1 | tee codex-output.txt

      - name: Claude independent review and repair
        id: claude
        continue-on-error: true
        env:
          COPILOT_MODEL: claude-sonnet-4.6
        run: |
          set -o pipefail
          copilot             -p "You are Leverage's independent senior Claude engineering reviewer.

Repository: ${GITHUB_REPOSITORY}
Target Actions run: ${TARGET_RUN_ID}
Research cycle: ${TARGET_CYCLE}
Failed stage: ${TARGET_STAGE}

A Codex worker has already investigated and may have changed the working tree.
Do NOT trust its diagnosis automatically. Independently inspect the failure,
the current working tree, repository evidence, and Strategy Hunter state.
Correct, complete, or replace the Codex repair where necessary.

The objective is to restore real Strategy Lab V4/RR backtesting and autonomous
research continuation.

Rules:
- Do not place live trades or orders.
- Never weaken Shariah, drawdown, cost, trade-frequency, data-integrity,
  lookahead, survivorship, or candidate-qualification protections.
- Never fabricate successful test evidence.
- Preserve degraded-cycle recovery semantics.
- Run targeted reproduction, Python compilation, Strategy Hunter preflight,
  and relevant narrow tests.
- Make only the smallest safe changes.
- Do not commit or push changes.

Review the Codex output at codex-output.txt when useful, but independently
validate it. Finish with root cause, accepted/rejected changes, and
verification evidence."             --model claude-sonnet-4.6             --no-ask-user             --allow-tool='write,shell'             --secret-env-vars='COPILOT_GITHUB_TOKEN,GITHUB_TOKEN'             --output-format=text             2>&1 | tee claude-output.txt

      - name: Verify repaired workspace
        run: |
          set -euo pipefail
          python -m py_compile             research/strategy/strategy_lab_v4.py             research/strategy/realistic_engine_v1.py             research/strategy/pipeline_orchestrator.py             research/strategy/preflight.py
          pip install -r research/strategy/requirements.txt
          python research/strategy/preflight.py

      - name: Determine whether repair exists
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No source changes were produced."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Create verified self-heal branch and PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="leverage-self-heal/dual-agent-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/strategy .github/workflows control_plane
          git commit -m "fix: dual-agent repair for Strategy Hunter"
          git push origin "$branch"
          gh pr create             --repo "${GITHUB_REPOSITORY}"             --base main             --head "$branch"             --title "[Leverage Self-Heal] Codex + Claude Strategy Hunter repair"             --body "Automated dual-agent repair.

Target run: ${TARGET_RUN_ID}
Cycle: ${TARGET_CYCLE}
Stage: ${TARGET_STAGE}

Codex investigated and proposed the first repair. Claude independently reviewed
and corrected the working tree. Deterministic compilation and Strategy Hunter
preflight passed before this PR was created.

The normal Self-Heal Repair Gate must still pass before merge."

      - name: Record agent result
        if: always()
        run: |
          echo "Codex exit: ${{ steps.codex.outcome }}"
          echo "Claude exit: ${{ steps.claude.outcome }}"
          if [ -f codex-output.txt ]; then
            tail -80 codex-output.txt
          fi
          if [ -f claude-output.txt ]; then
            tail -80 claude-output.txt
          fi
