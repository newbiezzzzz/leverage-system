name: compile-agentic-workflows

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/*.md"
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'chore: compile agentic workflows')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up GitHub CLI extension
        run: |
          set -euo pipefail
          gh extension install github/gh-aw

      - name: Compile agentic workflows
        run: |
          set -euo pipefail
          gh aw compile --strict

      - name: Publish compiled lock files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/*.lock.yml
          if git diff --cached --quiet; then
            echo "No compiled workflow changes."
            exit 0
          fi
          git commit -m "chore: compile agentic workflows"
          git push
