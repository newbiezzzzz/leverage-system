name: strategy-hunter-autoloop

concurrency:
  group: strategy-hunter-autoloop-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows: ["strategy-hunter-data-smoke"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  continue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check triggering run really completed full research
        id: full
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          run_id=os.environ["RUN_ID"]
          out=subprocess.check_output([
              "gh","api",f"repos/${{ github.repository }}/actions/runs/{run_id}/jobs?per_page=100"
          ], text=True)
          jobs=json.loads(out).get("jobs", [])
          full=[j for j in jobs if j.get("name")=="full"]
          ok=bool(full) and full[0].get("conclusion")=="success"
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"eligible={'true' if ok else 'false'}\n")
          print("eligible:", ok)

      - name: Check Strategy Hunter goal gate
        id: goal
        run: |
          python research/strategy/goal_gate.py

      - name: Stop when goal is achieved
        if: steps.goal.outputs.achieved == 'true' || (github.event_name == 'workflow_run' && steps.full.outputs.eligible != 'true')
        run: |
          echo "No new full research cycle needed right now."

      - name: Check for another active Strategy Hunter run
        id: active
        if: steps.goal.outputs.achieved != 'true' && (github.event_name == 'workflow_dispatch' || steps.full.outputs.eligible == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          out=subprocess.check_output([
              "gh","api",
              "repos/${{ github.repository }}/actions/workflows/strategy-hunter-data-smoke.yml/runs?per_page=10&branch=main"
          ],text=True)
          runs=json.loads(out).get("workflow_runs",[])
          this=int(os.environ.get("RUN_ID","0"))
          active=any(r.get("id")!=this and r.get("status") in {"queued","in_progress"} for r in runs)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"blocked={'true' if active else 'false'}\n")
          print("another active run:", active)
          PY

      - name: Continue research automatically
        if: steps.goal.outputs.achieved != 'true' && steps.active.outputs.blocked != 'true' && (github.event_name == 'workflow_dispatch' || steps.full.outputs.eligible == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Goal not achieved and no other active research cycle exists. Starting the next cycle."
          sleep 120
          gh workflow run strategy-hunter-data-smoke.yml --ref main
