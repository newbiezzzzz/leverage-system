name: BTCUSDT User Strategy Backtest

on:
  workflow_dispatch:
    inputs:
      strategy_path:
        description: "Optional path to the prepared strategy JSON"
        required: false
        type: string
        default: ""
      market_type:
        description: "Historical dataset to retrieve"
        required: true
        type: choice
        options:
          - spot
          - usdt_perpetual
        default: spot
      download_history:
        description: "Download BTCUSDT 1-minute history from 2024-01-01 through yesterday UTC"
        required: true
        type: boolean
        default: true
  pull_request:
    paths:
      - "projects/btcusdt_backtest/**"
      - "data/btcusdt/**"
      - ".github/workflows/btcusdt-backtest.yml"
  push:
    paths:
      - "projects/btcusdt_backtest/**"
      - "data/btcusdt/**"
      - ".github/workflows/btcusdt-backtest.yml"

permissions:
  contents: read

concurrency:
  group: btcusdt-user-strategy-backtest
  cancel-in-progress: false

jobs:
  validate-and-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and run regression tests
        run: |
          python -m py_compile projects/btcusdt_backtest/runner.py projects/btcusdt_backtest/fetch_binance_klines.py projects/btcusdt_backtest/strategy_sweep.py
          python -m unittest discover -s projects/btcusdt_backtest/tests -v
          python -m json.tool projects/btcusdt_backtest/config.json >/dev/null
          python -m json.tool projects/btcusdt_backtest/strategies/strategy_template.json >/dev/null
          python -m json.tool projects/btcusdt_backtest/strategies/strategy.schema.json >/dev/null
      - name: Download historical BTCUSDT data
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.download_history }}
        env:
          MARKET_TYPE: ${{ inputs.market_type || 'spot' }}
        run: |
          python projects/btcusdt_backtest/fetch_binance_klines.py --market-type "$MARKET_TYPE" --start-date 2023-01-01 --output data/btcusdt/btcusdt_1m.csv --metadata data/btcusdt/download_report.json
          python - <<'PY'
          import json
          r=json.load(open("data/btcusdt/download_report.json", encoding="utf-8"))
          if r["rows"] < 1000:
              raise SystemExit(f"Insufficient historical rows retrieved: {r['rows']}")
          print(f"Retrieved {r['rows']} candles from {r['first_candle_utc']} through {r['last_candle_utc']}; gaps={r['missing_minute_intervals']}")
          PY
      - name: Prepare blocked status when no strategy is submitted
        if: ${{ !((github.event_name == 'workflow_dispatch' && inputs.strategy_path != '') || hashFiles('projects/btcusdt_backtest/strategies/active_strategy.json') != '') }}
        run: |
          mkdir -p artifacts/btcusdt_backtest
          cat > artifacts/btcusdt_backtest/latest_report.json <<'JSON'
          {
            "project": "P-BTCUSDT-BACKTEST",
            "status": "BLOCKED",
            "reason": "No user strategy JSON was selected. Historical data may have been retrieved, but no performance backtest was attempted.",
            "research_only": true,
            "live_orders": false
          }
          JSON
          echo "# BTCUSDT user-strategy backtest" > artifacts/btcusdt_backtest/latest_report.md
          echo "" >> artifacts/btcusdt_backtest/latest_report.md
          echo "Status: BLOCKED — no user strategy submitted. Data acquisition status is in download_report.json." >> artifacts/btcusdt_backtest/latest_report.md
      - name: Run supplied strategy
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.strategy_path != '') || hashFiles('projects/btcusdt_backtest/strategies/active_strategy.json') != '' }}
        env:
          STRATEGY_PATH: ${{ github.event.inputs.strategy_path }}
          MARKET_TYPE: ${{ inputs.market_type }}
          BTCUSDT_FEE_RATE_PER_SIDE: ${{ vars.BTCUSDT_FEE_RATE_PER_SIDE }}
          BTCUSDT_SLIPPAGE_BPS: ${{ vars.BTCUSDT_SLIPPAGE_BPS }}
        run: |
          STRATEGY_PATH="${STRATEGY_PATH:-projects/btcusdt_backtest/strategies/active_strategy.json}"
          MARKET_TYPE="${MARKET_TYPE:-spot}"
          test -f "$STRATEGY_PATH" || { echo "::error::Strategy JSON path does not exist: $STRATEGY_PATH"; exit 1; }
          if [ "${STRATEGY_PATH##*/}" = "active_strategy.json" ]; then
            INPUT_FILE="data/btcusdt/btcusdt_1d.csv"
            INPUT_INTERVAL="1d"
            START_DATE="2017-08-17"
            RUN_SWEEP=1
          else
            INPUT_FILE="data/btcusdt/btcusdt_1m.csv"
            INPUT_INTERVAL="1m"
            START_DATE="2023-01-01"
            RUN_SWEEP=0
          fi
          if [ ! -f "$INPUT_FILE" ]; then
            python projects/btcusdt_backtest/fetch_binance_klines.py --market-type "$MARKET_TYPE" --interval "$INPUT_INTERVAL" --start-date "$START_DATE" --output "$INPUT_FILE" --metadata data/btcusdt/download_report.json
          fi
          ARGS=(--strategy "$STRATEGY_PATH" --input "$INPUT_FILE" --output artifacts/btcusdt_backtest)
          if [ -n "$BTCUSDT_FEE_RATE_PER_SIDE" ]; then ARGS+=(--fee-rate-per-side "$BTCUSDT_FEE_RATE_PER_SIDE"); fi
          if [ -n "$BTCUSDT_SLIPPAGE_BPS" ]; then ARGS+=(--slippage-bps "$BTCUSDT_SLIPPAGE_BPS"); fi
          if [ "$RUN_SWEEP" = "1" ]; then
            python projects/btcusdt_backtest/strategy_sweep.py "${ARGS[@]}"
          else
            python projects/btcusdt_backtest/runner.py "${ARGS[@]}"
          fi
      - name: Upload backtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-user-strategy-report
          path: |
            artifacts/btcusdt_backtest/
            data/btcusdt/download_report.json
            data/btcusdt/DATA_SOURCE.md
          if-no-files-found: warn
          retention-days: 30
      - name: Upload retrieved historical data
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.download_history }}
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-historical-data
          path: |
            data/btcusdt/btcusdt_1m.csv
            data/btcusdt/btcusdt_1d.csv
            data/btcusdt/download_report.json
            data/btcusdt/DATA_SOURCE.md
          if-no-files-found: warn
          retention-days: 30
