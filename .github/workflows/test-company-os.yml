name: Leverage Company OS Tests

on:
  push:
    paths:
      - 'control_plane/**'
      - 'workers/**'
      - 'cli/**'
      - 'server/**'
      - 'dashboard/**'
      - 'leverage.cmd'
      - 'leverage-server.cmd'
      - '.github/workflows/test-company-os.yml'
  pull_request:
    paths:
      - 'control_plane/**'
      - 'workers/**'
      - 'cli/**'
      - 'server/**'
      - 'dashboard/**'
      - 'leverage.cmd'
      - 'leverage-server.cmd'
      - '.github/workflows/test-company-os.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run company OS tests
        run: python -m unittest -v control_plane/test_company_core.py control_plane/test_finance_core.py control_plane/test_dispatcher.py control_plane/test_company_ops.py control_plane/test_gates.py control_plane/test_cli.py control_plane/test_readiness.py control_plane/test_project_admin.py control_plane/test_local_sync.py control_plane/test_acquisition_worker.py control_plane/test_delivery_gateway.py control_plane/test_channel_adapter.py control_plane/test_gumroad_connector.py server/test_api.py workers/test_runtime.py workers/test_digital_product_worker.py dashboard/test_dashboard.py
      - name: Worker runtime tests
        run: python -m unittest -v workers.test_runtime
      - name: Dashboard contract tests
        run: python -m unittest -v dashboard.test_dashboard
      - name: Company OS release gate
        run: python -m control_plane.readiness
      - name: Worker self-tests
        run: |
          python workers/code_worker.py
          python workers/data_worker.py
          python workers/digital_product_worker.py
          python workers/project_manager_worker.py
          python workers/operations_worker.py
          python workers/customer_worker.py
          python workers/acquisition_worker.py
          python workers/finance_worker.py
      - name: Local API startup smoke test
        run: |
          python -c "from server.leverage_api import HOST, PORT, system_snapshot, company_os_readiness; print(f'API import OK: {HOST}:{PORT}'); print(system_snapshot()); print(company_os_readiness()['status'])"
