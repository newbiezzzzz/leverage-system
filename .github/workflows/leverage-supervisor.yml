name: leverage-supervisor

run-name: Leverage supervisor
# Completion-aware watchdog: upstream runs are also checked by the 15-minute supervisor.

on:
  push:
    branches: [main]
    paths:
      - "research/strategy/**"
      - "control_plane/**"
      - ".github/workflows/**"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "strategy-hunter-cycle"
      - "strategy-hunter-data-full"
      - "Leverage Recovery Engine"
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: leverage-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Decide mission continuation
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess

          repo = os.environ["GITHUB_REPOSITORY"]

          def api(path):
              return json.loads(
                  subprocess.check_output(["gh", "api", path], text=True)
              )

          def runs(workflow):
              return api(
                  f"repos/{repo}/actions/workflows/{workflow}/runs?branch=main&per_page=30"
              ).get("workflow_runs", [])

          cycle_runs = runs("strategy-hunter-cycle.yml")
          data_runs = runs("strategy-hunter-data-full.yml")
          recovery_runs = runs("leverage-recovery-engine.yml")

          active_cycle = any(
              r.get("status") in {"queued", "in_progress"} for r in cycle_runs
          )
          active_data = any(
              r.get("status") in {"queued", "in_progress"} for r in data_runs
          )
          active_recovery = any(
              r.get("status") in {"queued", "in_progress"} for r in recovery_runs
          )

          latest_cycle = cycle_runs[0] if cycle_runs else None
          latest_data = data_runs[0] if data_runs else None
          latest_recovery = recovery_runs[0] if recovery_runs else None

          failed_cycle = bool(
              latest_cycle
              and latest_cycle.get("status") == "completed"
              and latest_cycle.get("conclusion") in {"failure", "cancelled", "timed_out"}
          )
          failed_data = bool(
              latest_data
              and latest_data.get("status") == "completed"
              and latest_data.get("conclusion") in {"failure", "cancelled", "timed_out"}
          )
          has_successful_data = any(
              r.get("status") == "completed" and r.get("conclusion") == "success"
              for r in data_runs
          )
          latest_successful_data = next(
              (
                  r for r in data_runs
                  if r.get("status") == "completed" and r.get("conclusion") == "success"
              ),
              None,
          )

          achieved = False
          goal_path = "research/results/strategy_hunter_goal.json"
          try:
              with open(goal_path, encoding="utf-8") as f:
                  goal = json.load(f)
              achieved = (
                  goal.get("status") == "achieved"
                  and goal.get("all_gates_passed") is True
              )
          except Exception:
              pass

          recovery_stale = bool(
              failed_cycle
              and (
                  latest_heal is None
                  or latest_heal.get("created_at", "") < latest_cycle.get("updated_at", "")
              )
          )
          heal_after_data = bool(
              failed_data
              and (
                  latest_heal is None
                  or latest_heal.get("created_at", "") < latest_data.get("updated_at", "")
              )
          )

          if achieved:
              action = "none"
              reason = "goal_achieved"
          elif active_cycle:
              action = "none"
              reason = "research_cycle_active"
          elif active_recovery:
              action = "none"
              reason = "recovery_active"
          elif active_data:
              action = "none"
              reason = "data_refresh_active"
          elif recovery_stale:
              action = "start_recovery"
              reason = "failed_workflow_needs_deterministic_recovery"
          elif not has_successful_data:
              action = "start_data"
              reason = "no_successful_dataset_available"
          else:
              action = "start_cycle"
              reason = "mission_not_achieved_and_prerequisites_ready"

          print("goal_achieved:", achieved)
          print("active_cycle:", active_cycle)
          print("active_data:", active_data)
          print("active_heal:", active_heal)
          print("has_successful_data:", has_successful_data)
          print("latest_successful_data:", latest_successful_data.get("id") if latest_successful_data else None)
          print("latest_cycle:", latest_cycle.get("id") if latest_cycle else None)
          print("latest_cycle_conclusion:", latest_cycle.get("conclusion") if latest_cycle else None)
          print("latest_data:", latest_data.get("id") if latest_data else None)
          print("latest_data_conclusion:", latest_data.get("conclusion") if latest_data else None)
          print("latest_heal:", latest_heal.get("id") if latest_heal else None)
          print("latest_heal_conclusion:", latest_heal.get("conclusion") if latest_heal else None)
          print("decision:", action, reason)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"action={action}\n")
              f.write(f"reason={reason}\n")
          PY

      - name: Start deterministic recovery
        if: steps.decision.outputs.action == 'start_recovery'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: gh workflow run leverage-recovery-engine.yml --ref main

      - name: Start data refresh
        if: steps.decision.outputs.action == 'start_data'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: gh workflow run strategy-hunter-data-full.yml --ref main

      - name: Start Strategy Hunter cycle
        if: steps.decision.outputs.action == 'start_cycle'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: gh workflow run strategy-hunter-cycle.yml --ref main

      - name: Supervisor completed
        run: echo "Leverage supervisor decision completed."
