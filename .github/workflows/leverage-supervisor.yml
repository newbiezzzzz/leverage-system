name: leverage-supervisor

run-name: Leverage supervisor

on:
  push:
    branches: [main]
    paths:
      - "research/strategy/**"
      - "control_plane/**"
      - ".github/workflows/**"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "strategy-hunter-cycle"
      - "strategy-hunter-data-full"
      - "Leverage Recovery Engine"
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: leverage-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Decide mission continuation
        id: decision
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess

          repo = os.environ["GITHUB_REPOSITORY"]

          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", path], text=True))

          def runs(workflow):
              return api(f"repos/{repo}/actions/workflows/{workflow}/runs?branch=main&per_page=30").get("workflow_runs", [])

          cycle_runs = runs("strategy-hunter-cycle.yml")
          data_runs = runs("strategy-hunter-data-full.yml")
          recovery_runs = runs("leverage-recovery-engine.yml")

          active_cycle = any(r.get("status") in {"queued", "in_progress"} for r in cycle_runs)
          active_data = any(r.get("status") in {"queued", "in_progress"} for r in data_runs)
          active_recovery = any(r.get("status") in {"queued", "in_progress"} for r in recovery_runs)

          latest_cycle = cycle_runs[0] if cycle_runs else None
          latest_data = data_runs[0] if data_runs else None

          def failed(r):
              return bool(r and r.get("status") == "completed" and r.get("conclusion") in {"failure", "cancelled", "timed_out"})

          latest_failure = None
          for r in [latest_cycle, latest_data]:
              if failed(r) and (latest_failure is None or r.get("updated_at", "") > latest_failure.get("updated_at", "")):
                  latest_failure = r

          has_successful_data = any(r.get("status") == "completed" and r.get("conclusion") == "success" for r in data_runs)

          achieved = False
          try:
              with open("research/results/strategy_hunter_goal.json", encoding="utf-8") as f:
                  goal = json.load(f)
              achieved = goal.get("status") == "achieved" and goal.get("all_gates_passed") is True
          except Exception:
              pass

          if achieved:
              action, reason = "none", "goal_achieved"
          elif active_cycle:
              action, reason = "none", "research_cycle_active"
          elif active_data:
              action, reason = "none", "data_refresh_active"
          elif active_recovery:
              action, reason = "none", "recovery_active"
          elif latest_failure:
              action, reason = "start_recovery", "failed_research_run"
          elif not has_successful_data:
              action, reason = "start_data", "no_successful_dataset_available"
          else:
              action, reason = "start_cycle", "mission_active"

          print("decision:", action, reason)
          print("latest_failure:", latest_failure.get("id") if latest_failure else None)
          print("latest_cycle:", latest_cycle.get("id") if latest_cycle else None)
          print("latest_data:", latest_data.get("id") if latest_data else None)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"action={action}\nreason={reason}\n")
          PY

      - name: Start recovery engine
        if: steps.decision.outputs.action == 'start_recovery'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: gh workflow run leverage-recovery-engine.yml --ref main

      - name: Start data refresh
        if: steps.decision.outputs.action == 'start_data'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: gh workflow run strategy-hunter-data-full.yml --ref main

      - name: Start Strategy Hunter cycle
        if: steps.decision.outputs.action == 'start_cycle'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: gh workflow run strategy-hunter-cycle.yml --ref main

      - name: Supervisor completed
        run: echo "Leverage supervisor decision completed."
