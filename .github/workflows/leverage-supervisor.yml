name: leverage-supervisor

run-name: Leverage supervisor

on:
  push:
    branches: [main]
    paths:
      - "research/strategy/**"
      - "control_plane/**"
      - ".github/workflows/**"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: leverage-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Decide mission continuation
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone

          repo = os.environ["GITHUB_REPOSITORY"]

          def api(path):
              return json.loads(
                  subprocess.check_output(["gh", "api", path], text=True)
              )

          def runs(workflow):
              return api(
                  f"repos/{repo}/actions/workflows/{workflow}/runs?branch=main&per_page=30"
              ).get("workflow_runs", [])

          cycle_runs = runs("strategy-hunter-cycle.yml")
          data_runs = runs("strategy-hunter-data-full.yml")
          heal_runs = runs("strategy-hunter-self-heal.lock.yml")

          active_cycle = any(
              r.get("status") in {"queued", "in_progress"} for r in cycle_runs
          )
          active_data = any(
              r.get("status") in {"queued", "in_progress"} for r in data_runs
          )
          active_heal = any(
              r.get("status") in {"queued", "in_progress"} for r in heal_runs
          )

          latest_cycle = cycle_runs[0] if cycle_runs else None
          failed_cycle = (
              latest_cycle
              if latest_cycle
              and latest_cycle.get("status") == "completed"
              and latest_cycle.get("conclusion") in {"failure", "cancelled", "timed_out"}
              else None
          )

          latest_heal = heal_runs[0] if heal_runs else None

          achieved = False
          goal_path = "research/results/strategy_hunter_goal.json"
          try:
              with open(goal_path, encoding="utf-8") as f:
                  goal = json.load(f)
              achieved = (
                  goal.get("status") == "achieved"
                  and goal.get("all_gates_passed") is True
              )
          except Exception:
              pass

          if achieved:
              action = "none"
              reason = "goal_achieved"
          elif active_cycle:
              action = "none"
              reason = "research_cycle_active"
          elif active_heal:
              action = "none"
              reason = "self_heal_active"
          elif failed_cycle and (
              latest_heal is None
              or latest_heal.get("created_at", "") < failed_cycle.get("updated_at", "")
          ):
              action = "start_self_heal"
              reason = "failed_research_needs_repair"
          elif failed_cycle:
              action = "none"
              reason = "repair_run_exists"
          elif active_data:
              action = "none"
              reason = "data_refresh_active"
          else:
              action = "start_cycle"
              reason = "mission_not_achieved_and_no_active_cycle"

          print("goal_achieved:", achieved)
          print("active_cycle:", active_cycle)
          print("active_data:", active_data)
          print("active_heal:", active_heal)
          print("latest_cycle:", latest_cycle.get("id") if latest_cycle else None)
          print("latest_cycle_conclusion:", latest_cycle.get("conclusion") if latest_cycle else None)
          print("latest_heal:", latest_heal.get("id") if latest_heal else None)
          print("decision:", action, reason)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"action={action}\n")
              f.write(f"reason={reason}\n")
          PY

      - name: Start self-heal
        if: steps.decision.outputs.action == 'start_self_heal'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run strategy-hunter-self-heal.lock.yml --ref main

      - name: Start Strategy Hunter cycle
        if: steps.decision.outputs.action == 'start_cycle'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run strategy-hunter-cycle.yml --ref main

      - name: Supervisor completed
        run: echo "Leverage supervisor decision completed."
