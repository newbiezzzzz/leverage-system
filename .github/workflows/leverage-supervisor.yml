name: leverage-supervisor

run-name: Leverage supervisor

on:
  push:
    branches: [main]
    paths:
      - "research/strategy/**"
      - "control_plane/**"
      - ".github/workflows/**"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - strategy-hunter-cycle
      - strategy-hunter-data-full
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: leverage-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Decide mission continuation
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone

          repo=os.environ["GITHUB_REPOSITORY"]

          def api(path):
              return json.loads(subprocess.check_output(["gh","api",path], text=True))

          def runs(workflow):
              return api(f"repos/{repo}/actions/workflows/{workflow}/runs?branch=main&per_page=30").get("workflow_runs", [])

          cycle_runs=runs("strategy-hunter-cycle.yml")
          data_runs=runs("strategy-hunter-data-full.yml")

          active_cycle=any(r.get("status") in {"queued","in_progress"} for r in cycle_runs)
          active_data=any(r.get("status") in {"queued","in_progress"} for r in data_runs)
          latest_data_success=next((r for r in data_runs if r.get("conclusion")=="success"), None)
          latest_data_attempt=data_runs[0] if data_runs else None

          def age_hours(dt):
              if not dt: return 10000
              x=datetime.fromisoformat(dt.replace("Z","+00:00"))
              return (datetime.now(timezone.utc)-x).total_seconds()/3600

          data_age=age_hours(latest_data_success.get("updated_at")) if latest_data_success else 10000
          last_data_attempt_age=age_hours(latest_data_attempt.get("updated_at")) if latest_data_attempt else 10000

          achieved=False
          try:
              g=json.load(open("research/results/strategy_hunter_goal.json",encoding="utf-8"))
              achieved=(g.get("status")=="achieved" and g.get("all_gates_passed") is True)
          except Exception:
              pass

          if achieved:
              action="none"; reason="goal_achieved"
          elif active_cycle:
              action="none"; reason="research_cycle_active"
          elif (not latest_data_success or data_age > 72) and not active_data and last_data_attempt_age >= 6:
              action="refresh_data"; reason=f"dataset_missing_or_stale_{data_age:.1f}h"
          elif active_data:
              action="none"; reason="data_refresh_active"
          else:
              action="start_cycle"; reason="mission_not_achieved_and_no_active_cycle"

          print("goal_achieved:", achieved)
          print("active_cycle:", active_cycle)
          print("active_data:", active_data)
          print("data_age_hours:", round(data_age,2))
          print("last_data_attempt_age_hours:", round(last_data_attempt_age,2))
          print("decision:", action, reason)

          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write(f"action={action}\n")
              f.write(f"reason={reason}\n")
          PY

      - name: Start data refresh when needed
        if: steps.decision.outputs.action == 'refresh_data'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run strategy-hunter-data-full.yml --ref main

      - name: Start Strategy Hunter research cycle
        if: steps.decision.outputs.action == 'start_cycle'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run strategy-hunter-cycle.yml --ref main

      - name: No action required
        if: steps.decision.outputs.action == 'none'
        run: echo "Supervisor: no action required."