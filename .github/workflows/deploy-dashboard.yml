name: Deploy Leverage Command Center

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'website/p001/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/p001
          cp -R dashboard/. _site/
          cp -R website/p001/. _site/p001/
          printf '%s\n' "${GITHUB_SHA}" > _site/deployment-commit.txt
      - name: Verify redesigned dashboard is in artifact
        run: |
          test -f _site/projects.html
          grep -q "PROJECT 001 · DIGITAL PRODUCTS" _site/projects.html
          grep -q "P001-DP01" _site/projects.html
          grep -q "P-002" _site/projects.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
