name: Deploy Leverage Command Center

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'website/p001/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/p001
          cp -R dashboard/. _site/
          cp -R website/p001/. _site/p001/
          printf '%s\n' "${GITHUB_SHA}" > _site/deployment-commit.txt
      - name: Verify master and all project dashboards in artifact
        run: |
          test -f _site/index.html
          test -f _site/master.html
          test -f _site/live-status.js
          test -f _site/project-strategy-hunter.html
          test -f _site/project-btcusdt.html
          test -f _site/project-fcpo.html
          test -f _site/project-fabrication-tools.html
          grep -q "Master Dashboard" _site/master.html
          grep -q "Strategy Hunter" _site/project-strategy-hunter.html
          grep -q "BTCUSDT" _site/project-btcusdt.html
          grep -q "FCPO" _site/project-fcpo.html
          grep -q "Fabrication Tool Network" _site/project-fabrication-tools.html
          grep -q "live-status.js" _site/master.html
          grep -q "P-002" _site/master.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
