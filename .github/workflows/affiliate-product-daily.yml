name: Leverage Affiliate Product Daily

on:
  schedule:
    - cron: '55 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  product-research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build product research candidates
        run: python -m control_plane.affiliate_product
      - name: Commit product queue
        run: |
          git config user.name 'leverage-bot'
          git config user.email 'leverage-bot@users.noreply.github.com'
          git add control_plane/affiliate_product_queue.json
          git diff --cached --quiet && exit 0
          git commit -m 'ops: refresh affiliate product research queue'
          git push
