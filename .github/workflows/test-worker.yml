name: Leverage FCPO Research Worker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Run FCPO research worker
        run: |
          set +e
          python research.py > worker_output.txt 2>&1
          EXIT_CODE=$?

          echo "# FCPO RESEARCH WORKER DIAGNOSTIC" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat worker_output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker exit code: $EXIT_CODE" >> "$GITHUB_STEP_SUMMARY"

          if [ "$EXIT_CODE" -ne 0 ]; then
            exit "$EXIT_CODE"
          fi

      - name: Publish FCPO research state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_report.md dashboard/research.json
          git diff --cached --quiet || git commit -m "chore: publish FCPO research state"
          git push
