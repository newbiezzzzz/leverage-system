name: Leverage Research Worker

on:
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Run research worker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python research.py

      - name: Publish research report
        if: always()
        run: |
          if [ -f market_report.md ]; then
            cat market_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Research Report" >> "$GITHUB_STEP_SUMMARY"
            echo "market_report.md was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
