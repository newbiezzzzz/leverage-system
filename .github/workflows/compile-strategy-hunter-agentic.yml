name: Compile Strategy Hunter agentic workflows

on:
  push:
    paths:
      - ".github/workflows/strategy-hunter-self-heal.md"
      - ".github/workflows/compile-strategy-hunter-agentic.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  workflows: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install GitHub Agentic Workflows
        run: gh extension install github/gh-aw

      - name: Check Copilot automation credential
        id: auth
        env:
          AUTOMATION_PAT: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if [ -z "$AUTOMATION_PAT" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::COPILOT_GITHUB_TOKEN is not configured yet."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile self-heal workflow
        run: gh aw compile strategy-hunter-self-heal --strict

      - name: Upload compiled workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: strategy-hunter-self-heal-lock
          path: .github/workflows/strategy-hunter-self-heal.lock.yml
          retention-days: 7

      - name: Validate compiled workflow exists
        run: |
          test -s .github/workflows/strategy-hunter-self-heal.lock.yml
          grep -q "Strategy Hunter Self-Heal" .github/workflows/strategy-hunter-self-heal.lock.yml

      - name: Publish compiled workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add .github/workflows/strategy-hunter-self-heal.lock.yml
          if git diff --cached --quiet; then
            echo "Compiled workflow is already current."
          else
            git commit -m "chore: compile Strategy Hunter self-heal agent"
            git pull --rebase origin main
            git push
          fi

      - name: Compiler complete
        run: echo "Agentic workflow compilation complete. Leverage supervisor owns research continuation."
