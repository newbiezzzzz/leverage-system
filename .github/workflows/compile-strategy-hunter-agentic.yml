name: Compile Strategy Hunter agentic workflows

on:
  push:
    paths:
      - ".github/workflows/strategy-hunter-self-heal.md"
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  actions: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install GitHub Agentic Workflows
        run: gh extension install github/gh-aw

      - name: Check Copilot automation credential
        id: auth
        env:
          AUTOMATION_PAT: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if [ -z "$AUTOMATION_PAT" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::COPILOT_GITHUB_TOKEN is not configured yet. Self-heal agent is installed in source form but cannot be activated in this personal repository until the one-time credential is added."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile self-heal workflow
        if: steps.auth.outputs.available == 'true'
        run: gh aw compile strategy-hunter-self-heal --strict

      - name: Upload compiled workflow artifact
        if: steps.auth.outputs.available != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: strategy-hunter-self-heal-lock
          path: .github/workflows/strategy-hunter-self-heal.lock.yml
          retention-days: 7

      - name: Validate compiled workflow exists
        if: steps.auth.outputs.available == 'true'
        run: |
          test -s .github/workflows/strategy-hunter-self-heal.lock.yml
          grep -q "Strategy Hunter Self-Heal" .github/workflows/strategy-hunter-self-heal.lock.yml

      - name: Publish compiled workflow
        if: steps.auth.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/strategy-hunter-self-heal.lock.yml
          if git diff --cached --quiet; then
            echo "Compiled workflow is already current."
          else
            git commit -m "chore: compile Strategy Hunter self-heal agent"
            git push
          fi

      - name: Resume Strategy Hunter through workflow dispatch
        if: steps.auth.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          gh workflow run strategy-hunter-data-smoke.yml --ref main
