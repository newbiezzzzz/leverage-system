name: leverage-recovery-engine

run-name: Leverage recovery engine

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Recovery reason"
        required: false
        default: "supervisor"
  workflow_run:
    workflows:
      - "strategy-hunter-cycle"
      - "strategy-hunter-data-full"
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: leverage-recovery-engine
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Choose recovery level
        id: decision
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess

          repo = os.environ["GITHUB_REPOSITORY"]

          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", path], text=True))

          def runs(wf, n=30):
              return api(f"repos/{repo}/actions/workflows/{wf}/runs?branch=main&per_page={n}").get("workflow_runs", [])

          cycle = runs("strategy-hunter-cycle.yml")
          data = runs("strategy-hunter-data-full.yml")
          heal = runs("strategy-hunter-self-heal.lock.yml")
          current_main = api(f"repos/{repo}/git/ref/heads/main").get("object", {}).get("sha")

          def active(items):
              return any(x.get("status") in {"queued", "in_progress"} for x in items)

          def failed(x):
              return x and x.get("status") == "completed" and x.get("conclusion") in {"failure", "cancelled", "timed_out"}

          latest_cycle = cycle[0] if cycle else None
          latest_data = data[0] if data else None

          # Published degraded state is a real recovery signal even when the
          # workflow conclusion is "success" because evidence publication uses
          # if: always(). Treat the current core-stage repair queue as the
          # authoritative failure episode.
          published_degraded = False
          repair_queue = {}
          try:
              with open("research/results/research_cycle_state.json", encoding="utf-8") as f:
                  published_degraded = json.load(f).get("status") == "degraded"
          except Exception:
              pass
          try:
              with open("research/results/repair_queue.json", encoding="utf-8") as f:
                  repair_queue = json.load(f)
          except Exception:
              repair_queue = {}

          target = None
          target_name = None
          if failed(latest_cycle):
              target, target_name = latest_cycle, "cycle"
          if failed(latest_data) and (target is None or latest_data.get("updated_at", "") > target.get("updated_at", "")):
              target, target_name = latest_data, "data"

          if active(cycle) or active(data):
              action, reason = "none", "research_already_running"
          elif published_degraded:
              core_items = [x for x in repair_queue.get("items", []) if x.get("tier") == "core"]
              attempts = max([int(x.get("attempts", 0)) for x in core_items] or [0])
              if attempts >= 3:
                  action, reason = "ai_repair", "degraded_core_after_three_retries"
              else:
                  action, reason = "retry_cycle", "degraded_core_retry"
              print("published_degraded:", True)
              print("core_retry_attempts:", attempts)
          elif target is None:
              action, reason = "none", "no_failed_research_run"
          else:
              target_runs = cycle if target_name == "cycle" else data
              consecutive_failures = 0
              for r in target_runs:
                  if failed(r):
                      consecutive_failures += 1
                  elif r.get("status") == "completed" and r.get("conclusion") == "success":
                      break

              heal_after_target = any(
                  h.get("created_at", "") >= target.get("updated_at", "")
                  for h in heal
              )

              # A newer main commit means the failure episode has changed.
              # Do not let an old self-heal record block testing the repaired code.
              code_changed_after_failure = bool(
                  current_main and target.get("head_sha") and
                  current_main != target.get("head_sha")
              )

              if code_changed_after_failure:
                  action, reason = "retry_cycle", "new_code_after_failed_run"
              elif consecutive_failures < 2:
                  action = "retry_data" if target_name == "data" else "retry_cycle"
                  reason = f"first_failure_{target_name}"
              elif heal_after_target:
                  action, reason = "none", "ai_repair_already_attempted_for_failure_episode"
              else:
                  action, reason = "ai_repair", f"repeated_{target_name}_failure"

              print("target:", target_name, target.get("id"))
              print("consecutive_failures:", consecutive_failures)
              print("heal_after_target:", heal_after_target)

          print("recovery:", action, reason)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"action={action}\nreason={reason}\n")
          PY

      - name: Retry data once
        if: steps.decision.outputs.action == 'retry_data'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: gh workflow run strategy-hunter-data-full.yml --ref main

      - name: Retry Strategy Hunter once
        if: steps.decision.outputs.action == 'retry_cycle'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: gh workflow run strategy-hunter-cycle.yml --ref main

      - name: Escalate to AI repair
        if: steps.decision.outputs.action == 'ai_repair'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: gh workflow run strategy-hunter-self-heal.lock.yml --ref main

      - name: Recovery result
        run: echo "Recovery level completed."
