name: Acquire BTCUSDT Research Data

on:
  workflow_dispatch:
    inputs:
      rows:
        description: Minimum daily rows to acquire
        required: false
        default: '500'
        type: string

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests pandas
      - name: Acquire and validate BTCUSDT
        env:
          TARGET_ROWS: ${{ inputs.rows || '500' }}
        run: python workers/data_worker/binance_btcusdt_daily.py --rows "$TARGET_ROWS" --output data/raw/btcusdt_daily.csv
      - name: Validate canonical dataset
        run: python workers/data_worker/multi_market_ohlcv.py data/raw/btcusdt_daily.csv --instrument BTCUSDT --timeframe 1d --min-rows 250
      - name: Upload dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-daily-research
          path: data/raw/btcusdt_daily.csv
