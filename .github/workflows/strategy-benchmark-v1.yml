name: Strategy Benchmark Tool V1

on:
  workflow_dispatch:
    inputs:
      instrument:
        description: Instrument to test
        required: true
        default: BTCUSDT
        type: string
      rows:
        description: Daily rows to use
        required: false
        default: '500'
        type: string

permissions:
  contents: write

concurrency:
  group: strategy-tool-v1
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pandas numpy
      - name: Acquire research data
        run: python workers/data_worker/binance_btcusdt_daily.py --rows "${{ inputs.rows }}" --output data/raw/btcusdt_daily.csv
        if: ${{ inputs.instrument == 'BTCUSDT' }}
      - name: Run customer-defined benchmark tool
        run: python workers/strategy_worker/technical_benchmark_v1.py --input data/raw/btcusdt_daily.csv --instrument "${{ inputs.instrument }}" --output dashboard/customer_benchmark_results.json
      - name: Preserve customer tool result
        uses: actions/upload-artifact@v4
        with:
          name: customer-strategy-benchmark-${{ inputs.instrument }}
          path: dashboard/customer_benchmark_results.json
