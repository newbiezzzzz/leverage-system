name: Strategy Benchmark V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/strategy_worker/**'
      - 'workers/data_worker/binance_btcusdt_daily.py'
      - '.github/workflows/strategy-benchmark-v1.yml'

permissions:
  contents: write

concurrency:
  group: strategy-benchmark-v1
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pandas numpy
      - name: Acquire BTCUSDT benchmark data
        run: python workers/data_worker/binance_btcusdt_daily.py --rows 500 --output data/raw/btcusdt_daily.csv
      - name: Run Strategy Benchmark V1
        run: python workers/strategy_worker/technical_benchmark_v1.py --input data/raw/btcusdt_daily.csv --instrument BTCUSDT --output dashboard/strategy_results.json
      - name: Commit measured strategy results
        run: |
          git config user.name "Leverage Worker"
          git config user.email "leverage-worker@users.noreply.github.com"
          git add dashboard/strategy_results.json
          git diff --cached --quiet || git commit -m "Record BTCUSDT Strategy Benchmark V1 results"
          git push
