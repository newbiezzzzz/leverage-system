<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Markup vs Margin Calculator</title><meta name="description" content="Calculate selling price, markup and gross margin from cost and target percentage."><style>body{font-family:system-ui;margin:0;background:#f5f7fa;color:#182230}.wrap{max-width:760px;margin:auto;padding:32px 16px}.card{background:#fff;border:1px solid #dfe4ea;border-radius:16px;padding:24px}.g{display:grid;gap:14px}.f label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.f input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cfd6df;border-radius:9px}.r{margin-top:20px;padding:16px;border:1px solid #e1e6ec;border-radius:12px}.big{font-size:30px;font-weight:800}.muted{color:#667085}</style></head><body><main class="wrap"><section class="card"><p class="muted">LEVERAGE · FREE TOOL</p><h1>Markup vs Margin Calculator</h1><div class="g"><div class="f"><label>Cost (RM)</label><input id="cost" type="number" value="100" min="0"></div><div class="f"><label>Target markup (%)</label><input id="markup" type="number" value="25" min="0"></div></div><div class="r"><div>Suggested price</div><div class="big" id="price">RM0.00</div><div class="muted" id="margin">Gross margin: 0.00%</div></div></section></main><script>function c(){let x=+cost.value||0,m=(+markup.value||0)/100,p=x*(1+m);price.textContent='RM'+p.toFixed(2);margin.textContent='Gross margin: '+(p?((p-x)/p*100):0).toFixed(2)+'%'}document.querySelectorAll('input').forEach(x=>x.addEventListener('input',c));c()</script></body></html>
