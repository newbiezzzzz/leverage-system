<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Shop Hourly Rate Calculator</title><meta name="description" content="Calculate a practical fabrication or machine shop hourly rate from annual costs and productive hours."><style>body{font-family:system-ui;margin:0;background:#f5f7fa;color:#182230}.wrap{max-width:760px;margin:auto;padding:32px 16px}.card{background:#fff;border:1px solid #dfe4ea;border-radius:16px;padding:24px}.g{display:grid;gap:14px}.f label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.f input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cfd6df;border-radius:9px}.r{margin-top:20px;padding:16px;border:1px solid #e1e6ec;border-radius:12px}.big{font-size:30px;font-weight:800}.muted{color:#667085}</style><script data-goatcounter="https://leverage.goatcounter.com/count" async src="//gc.zgo.at/count.v5.js"></script></head><body><main class="wrap"><section class="card"><p class="muted">LEVERAGE · FREE TOOL</p><h1>Shop Hourly Rate Calculator</h1><p class="muted">Estimate the hourly rate needed to cover annual operating costs and productive shop hours.</p><div class="g"><div class="f"><label>Annual fixed costs (RM)</label><input id="fixed" type="number" value="60000" min="0"></div><div class="f"><label>Annual labor/payroll costs (RM)</label><input id="labor" type="number" value="120000" min="0"></div><div class="f"><label>Other annual costs (RM)</label><input id="other" type="number" value="30000" min="0"></div><div class="f"><label>Productive hours/year</label><input id="hours" type="number" value="1600" min="1"></div></div><div class="r"><div class="muted">Break-even shop rate</div><div class="big" id="out">RM0.00/hour</div></div></section></main><script>function c(){let t=+fixed.value+ +labor.value+ +other.value;out.textContent='RM'+(t/(+hours.value||1)).toFixed(2)+'/hour'}document.querySelectorAll('input').forEach(x=>x.addEventListener('input',c));c()</script><script src="/public-telemetry.js" defer></script></body></html>
