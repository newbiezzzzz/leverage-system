<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Job Profit Calculator</title><meta name="description" content="Calculate actual job profit from quoted revenue, labor, materials, consumables and overhead."><style>body{font-family:system-ui;margin:0;background:#f5f7fa;color:#182230}.wrap{max-width:760px;margin:auto;padding:32px 16px}.card{background:#fff;border:1px solid #dfe4ea;border-radius:16px;padding:24px}.g{display:grid;gap:14px}.f label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.f input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cfd6df;border-radius:9px}.r{margin-top:20px;padding:16px;border:1px solid #e1e6ec;border-radius:12px}.big{font-size:30px;font-weight:800}.muted{color:#667085}</style></head><body><main class="wrap"><section class="card"><p class="muted">LEVERAGE · FREE TOOL</p><h1>Job Profit Calculator</h1><div class="g"><div class="f"><label>Quoted revenue (RM)</label><input id="rev" type="number" value="1500" min="0"></div><div class="f"><label>Actual labor cost (RM)</label><input id="labor" type="number" value="450" min="0"></div><div class="f"><label>Materials (RM)</label><input id="mat" type="number" value="300" min="0"></div><div class="f"><label>Consumables (RM)</label><input id="cons" type="number" value="50" min="0"></div><div class="f"><label>Overhead allocated (RM)</label><input id="oh" type="number" value="120" min="0"></div></div><div class="r"><div class="muted">Estimated gross profit</div><div class="big" id="profit">RM0.00</div><div class="muted" id="margin">Margin: 0.00%</div></div></section></main><script>function c(){let r=+rev.value||0,c=(+labor.value||0)+(+mat.value||0)+(+cons.value||0)+(+oh.value||0),p=r-c;profit.textContent='RM'+p.toFixed(2);margin.textContent='Margin: '+(r?(p/r*100):0).toFixed(2)+'%'}document.querySelectorAll('input').forEach(x=>x.addEventListener('input',c));c()</script></body></html>
