<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Welding Quote Calculator</title><meta name="description" content="Estimate a welding job quote using prep time, welding hours, consumables, materials and overhead."><style>body{font-family:system-ui;margin:0;background:#f5f7fa;color:#182230}.wrap{max-width:760px;margin:auto;padding:32px 16px}.card{background:#fff;border:1px solid #dfe4ea;border-radius:16px;padding:24px}.g{display:grid;gap:14px}.f label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.f input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cfd6df;border-radius:9px}.r{margin-top:20px;padding:16px;border:1px solid #e1e6ec;border-radius:12px}.big{font-size:30px;font-weight:800}.muted{color:#667085}</style></head><body><main class="wrap"><section class="card"><p class="muted">LEVERAGE · FREE TOOL</p><h1>Welding Quote Calculator</h1><p class="muted">Build a quick planning estimate from prep, welding, materials, consumables and overhead.</p><div class="g"><div class="f"><label>Prep/fit-up hours</label><input id="prep" type="number" value="2" min="0"></div><div class="f"><label>Welding hours</label><input id="weld" type="number" value="4" min="0"></div><div class="f"><label>Labor rate (RM/hour)</label><input id="rate" type="number" value="50" min="0"></div><div class="f"><label>Materials (RM)</label><input id="mat" type="number" value="180" min="0"></div><div class="f"><label>Consumables (RM)</label><input id="cons" type="number" value="35" min="0"></div><div class="f"><label>Overhead (RM)</label><input id="oh" type="number" value="70" min="0"></div><div class="f"><label>Markup (%)</label><input id="markup" type="number" value="25" min="0"></div></div><div class="r"><div class="muted">Suggested quote</div><div class="big" id="quote">RM0.00</div><div class="muted" id="cost">Cost: RM0.00</div></div></section></main><script>function c(){let h=(+prep.value||0)+(+weld.value||0),cost=h*(+rate.value||0)+(+mat.value||0)+(+cons.value||0)+(+oh.value||0),q=cost*(1+(+markup.value||0)/100);quote.textContent='RM'+q.toFixed(2);document.getElementById('cost').textContent='Cost: RM'+cost.toFixed(2)}document.querySelectorAll('input').forEach(x=>x.addEventListener('input',c));c()</script><script src="/public-telemetry.js" defer></script></body></html>
